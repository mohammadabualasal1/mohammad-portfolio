<header class="nav" [class.nav--scrolled]="scrolled() || menuOpen()">
  <div class="nav__inner container">
    <a class="nav__brand" routerLink="/" fragment="top" (click)="closeMenu()" aria-label="Mohammad Abu-Alasal — home">Mohammad Abu-Alasal</a>

    <nav class="nav__links" aria-label="Primary">
      @for (link of links; track link.fragment) {
        <a routerLink="/" [fragment]="link.fragment" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>

    <div class="nav__actions">
      <a
        class="nav__icon"
        [href]="site.github"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="GitHub profile"
      >
        <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M12 .5A11.5 11.5 0 0 0 .5 12c0 5.09 3.29 9.4 7.86 10.93.57.11.78-.25.78-.55v-2.16c-3.2.7-3.87-1.36-3.87-1.36-.53-1.33-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.09-.12-.29-.52-1.47.11-3.06 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.2-1.49 3.17-1.18 3.17-1.18.63 1.59.24 2.77.12 3.06.74.8 1.19 1.83 1.19 3.09 0 4.43-2.7 5.4-5.27 5.69.41.36.78 1.07.78 2.16v3.2c0 .3.2.66.79.55A11.51 11.51 0 0 0 23.5 12 11.5 11.5 0 0 0 12 .5Z"
          />
        </svg>
      </a>
      <a
        class="nav__icon"
        [href]="site.linkedin"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="LinkedIn profile"
      >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path
            d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.27ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"
          />
        </svg>
      </a>
      <a class="btn btn--secondary nav__resume" [href]="site.resumePath" download target="_blank" rel="noopener">
        Resume
      </a>
    </div>

    <button
      class="nav__toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="menuOpen()"
      aria-controls="mobile-menu"
      aria-label="Toggle menu"
    >
      <span></span><span></span><span></span>
    </button>
  </div>

  <div class="nav__mobile" id="mobile-menu" [class.nav__mobile--open]="menuOpen()">
    <nav aria-label="Mobile primary">
      @for (link of links; track link.fragment) {
        <a routerLink="/" [fragment]="link.fragment" (click)="closeMenu()">{{ link.label }}</a>
      }
    </nav>
    <div class="nav__mobile-actions">
      <a class="btn btn--primary" [href]="site.resumePath" download target="_blank" rel="noopener">Download Resume</a>
      <div class="nav__mobile-icons">
        <a [href]="site.github" target="_blank" rel="noopener noreferrer" aria-label="GitHub profile">GitHub</a>
        <a [href]="site.linkedin" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn profile">LinkedIn</a>
      </div>
    </div>
  </div>
</header>
